[project]
name = "agr-curation-schema"
description = "Schema and generated objects for agr-curation-schema data model and upper ontology"
version = "0.0.0"
authors = [
    { name = "Alliance of Genome Resources" },
]
requires-python = ">=3.10,<4.0"
dependencies = [
    "linkml>=1.8.6,<2.0",
    "mkdocs>=1.3.0,<2.0",
    "mkdocs-mermaid2-plugin>=0.6.0,<0.7",
]

[tool.uv]
# This project is an environment for running LinkML generators against the
# schema; it is not installed as a Python package.
package = false
