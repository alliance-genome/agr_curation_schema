id: https://github.com/alliance-genome/agr_curation_schema/src/schema/nucleicAcidReagent.yaml
name: nucleicAcidReagent
title: Nucleic Acid Reagents

imports:
  - reagent
  - affectedGenomicModel
  - core
  - reference
  - controlledVocabulary
  - ontologyTerm
  - linkml:types

prefixes:
  alliance: http://alliancegenome.org/
  linkml: https://w3id.org/linkml/

default_prefix: alliance
default_range: string

classes:

  NucleicAcidReagent:
    is_a: Reagent
    description: An experimentally used nucleic-acid material or a separately identified preparation
      of that material. Excludes sequence-only records, abstract primer-pair definitions and
      genetic-marker identities.
    abstract: true
    slots:
      - reagent_preparation_protocol
      - reagent_primer_pairs
      - derived_from_reagents
      - name
      - taxon
      - nucleic_acid_reagent_type
      - nucleic_acid_reagent_synonyms
      - cross_references
      - references
      - generated_by
      - nucleic_acid_sources
      - reagent_sequences
      - reagent_availability
    slot_usage:
      taxon:
        required: false
      name:
        required: false
    notes:
      - First working proposal; no inference of physical material from a source class name
        or sequence origin alone.
      - Construct, Cassette and SequenceTargetingReagent retain their existing parents.
        RNAClone has been removed from this proposal.

  NucleicAcidReagentDTO:
    is_a: ReagentDTO
    description: Submission foundation for nucleic-acid materials and preparations. Submit
      a provider and either primary_external_id or mod_internal_id; inherited source identifiers
      must not be invented.
    abstract: true
    slots:
      - reagent_preparation_protocol
      - reagent_primer_pair_identifiers
      - derived_from_reagent_identifiers
      - name
      - taxon_curie
      - nucleic_acid_reagent_type_name
      - nucleic_acid_reagent_synonym_dtos
      - cross_reference_dtos
      - reference_curies
      - generated_by_identifiers
      - nucleic_acid_source_dtos
      - reagent_sequence_dtos
      - reagent_availability_name
    slot_usage:
      taxon_curie:
        required: false
      name:
        required: false

  NucleicAcidReagentSynonymSlotAnnotation:
    is_a: NameSlotAnnotation
    description: An alternative name for a nucleic-acid reagent with its own evidence and
      metadata.
    slots:
      - single_nucleic_acid_reagent

  DNAClone:
    is_a: NucleicAcidReagent
    description: A DNA insert cloned into a vector, whether or not the clone is still available. Insert origin
      is recorded separately when known; sequence origin alone does not establish a clone.
    slots:
      - clone_vector
      - clone_collection_statuses
      - clone_known_problems
      - clone_assessment
      - replaces_clones
      - clone_insert_origin
      - clone_vector_name
      - clone_vector_type
      - clone_insert_length
      - clone_cloning_sites

  DNACloneDTO:
    is_a: NucleicAcidReagentDTO
    description: Submission of a confirmed DNA clone with known or unknown insert origin.
    slots:
      - clone_vector_identifier
      - clone_collection_status_names
      - clone_known_problems
      - clone_assessment
      - replaces_clone_identifiers
      - clone_insert_origin_name
      - clone_vector_name
      - clone_vector_type_name
      - clone_insert_length
      - clone_cloning_sites

  PCRProduct:
    is_a: NucleicAcidReagent
    description: A DNA product generated by PCR and identified by the provider as a reagent.
      A primer pair or primer-defined genetic marker is not by itself a PCR product.
    slots:
      - pcr_primer_pair
      - forward_primer_sequence
      - reverse_primer_sequence
      - pcr_assay_method
      - pcr_assay_conditions
      - pcr_template_description
      - pcr_template_source_identifiers

  PCRProductDTO:
    is_a: NucleicAcidReagentDTO
    description: Submission of a PCR product; taxon and either primer may be absent in legitimate
      legacy records.
    slots:
      - pcr_primer_pair_identifier
      - forward_primer_sequence
      - reverse_primer_sequence
      - pcr_assay_method_name
      - pcr_assay_conditions
      - pcr_template_description
      - pcr_template_source_identifiers

  NucleicAcidProbePreparation:
    is_a: NucleicAcidReagent
    description: A separately recorded assay-ready nucleic-acid preparation, such as labeled
      antisense RNA. Do not manufacture one solely to wrap a directly used clone or PCR product.
      MGI preparations belong to an assay.
    slots:
      - source_template_identifiers
      - preparation_assay_identifier
      - probe_nucleic_acid_type
      - probe_strand_orientation
      - probe_labels
      - probe_visualization_methods
      - probe_polymerase

  NucleicAcidProbePreparationDTO:
    is_a: NucleicAcidReagentDTO
    description: Submission of a distinct preparation using its provider-qualified stable
      source ID. Probe replacement and deletion policies require owner agreement.
    slots:
      - source_template_identifiers
      - preparation_assay_identifier
      - probe_nucleic_acid_type_name
      - probe_strand_orientation_name
      - probe_label_names
      - probe_visualization_method_names
      - probe_polymerase_name

  NucleicAcidSource:
    is_a: AuditedObject
    description: A biological-source or library-membership description scoped to one record.
      A reusable library may be referenced without copying its properties into every membership.
    slots:
      - source_library
      - source_vector
      - source_tissue_free_text
      - source_stage_free_text
      - source_library_name
      - source_library_type
      - source_library_membership_relation
      - source_vector_name
      - source_tissue
      - source_stage
      - source_age
      - source_genetic_background
      - source_vector_type
      - source_cloning_sites
      - references

  NucleicAcidSourceDTO:
    is_a: AuditedObjectDTO
    description: Inline submission of biological-source details or library membership.
    slots:
      - source_vector_identifier
      - source_tissue_free_text
      - source_stage_free_text
      - source_library_identifier
      - source_library_name
      - source_library_type_name
      - source_library_membership_relation_name
      - source_vector_name
      - source_tissue_curie
      - source_stage_curie
      - source_age
      - source_genetic_background_identifier
      - source_vector_type_name
      - source_cloning_sites
      - reference_curies

  ReagentSequence:
    is_a: AuditedObject
    description: Sequence evidence about a material or sequence record, retaining the source sequence identity
      and role. It is not another reagent.
    slots:
      - reagent_sequence_source_identifier
      - reagent_sequence_accessions
      - reagent_sequence_residues
      - reagent_sequence_role
      - references

  ReagentSequenceDTO:
    is_a: AuditedObjectDTO
    description: Inline sequence evidence; retain multiple reads or insert sequences rather
      than overwriting them.
    slots:
      - reagent_sequence_source_identifier
      - reagent_sequence_accessions
      - reagent_sequence_residues
      - reagent_sequence_role_name
      - reference_curies

  NucleicAcidReagentAssociation:
    is_a: EvidenceAssociation
    description: Base for evidence-supported associations with a nucleic-acid material, primer-pair or sequence-record subject.
    abstract: true
    slots:
      - nucleic_acid_reagent_association_subject

  NucleicAcidReagentGenomicEntityAssociation:
    is_a: NucleicAcidReagentAssociation
    description: A typed, evidenced nucleic-acid-record-to-genomic-entity relationship. Keep computed
      support, hybridization, amplification, encoding and overlap semantically distinct. It
      is not an expression-detection assertion.
    slots:
      - nucleic_acid_reagent_genomic_entity_association_object
      - related_notes
      - source_association_identifier
      - reagent_association_source_relation
      - reagent_association_method
      - reagent_association_method_version
      - reagent_association_source_release
      - supporting_sequence_identifiers
      - supporting_transcript_identifiers
    slot_usage:
      relation:
        range: VocabularyTerm
        notes: 'Proposed CV: Nucleic Acid Reagent Genomic Entity Association Relation. Candidate
          values: encodes, hybridizes_to, amplifies, overlaps_cds, overlaps_transcript, overlaps_pseudogene,
          overlaps_variant, sequence_supports, contains_gene, partially_overlaps_gene. Values and endpoint applicability require vocabulary-owner
          review.'

  NucleicAcidReagentGenomicEntityAssociationDTO:
    is_a: EvidenceAssociationDTO
    description: Submission of a separately loaded reagent-to-genomic-entity relationship.
      The subject and target must resolve before loading the association.
    slots:
      - nucleic_acid_reagent_identifier
      - relation_name
      - genomic_entity_identifier
      - note_dtos
      - source_association_identifier
      - reagent_association_source_relation
      - reagent_association_method_name
      - reagent_association_method_version
      - reagent_association_source_release
      - supporting_sequence_identifiers
      - supporting_transcript_identifiers
    slot_usage:
      genomic_entity_identifier:
        required: true
        description: Primary external ID or internal ID of the associated GenomicEntity.

  NucleicAcidSequenceRecord:
    is_a: SubmittedObject
    description: >-
      A provider-identified sequence or read-anchoring record without an asserted cloned material.
      Retains its source identity, library, sequence evidence and references. It is not a Reagent
      and cannot be used as an expression detection material.
    slots:
      - name
      - taxon
      - cross_references
      - references
      - nucleic_acid_sources
      - reagent_sequences
      - sequence_record_type
    slot_usage:
      name:
        required: false
      taxon:
        required: false

  NucleicAcidSequenceRecordDTO:
    is_a: SubmittedObjectDTO
    description: >-
      Submission of a sequence or read-anchoring record, including never-cloned FlyBase FBcl
      records. Classification requires source evidence; an assay-library designation alone is
      insufficient.
    slots:
      - name
      - taxon_curie
      - cross_reference_dtos
      - reference_curies
      - nucleic_acid_source_dtos
      - reagent_sequence_dtos
      - sequence_record_type_name
    slot_usage:
      name:
        required: false
      taxon_curie:
        required: false

  Oligo:
    is_a: NucleicAcidReagent
    description: >-
      A separately identified physical oligonucleotide reagent. Primer use does not require a
      separate subclass. Sequence alone does not establish a distinct material identity.
    slots:
      - oligo_sequence
      - oligo_chemical_type
      - oligo_modifications
      - oligo_sequence_context

  OligoDTO:
    is_a: NucleicAcidReagentDTO
    description: >-
      Submission of a provider-identified oligonucleotide; retain source identity even when sequence
      is unavailable.
    slots:
      - oligo_sequence
      - oligo_chemical_type_name
      - oligo_modification_names
      - oligo_sequence_context_name

  PrimerPair:
    is_a: SubmittedObject
    description: >-
      A provider-identified definition of two primers used together. This definition is not an
      amplified product or a physical reagent. Primer sequences may include vector and insert-
      derived portions.
    slots:
      - name
      - taxon
      - references
      - cross_references
      - forward_oligo
      - reverse_oligo
      - forward_primer_sequence
      - reverse_primer_sequence
      - primer_pair_template_description
    slot_usage:
      name:
        required: false
      taxon:
        required: false

  PrimerPairDTO:
    is_a: SubmittedObjectDTO
    description: >-
      Submission of a primer-pair definition. Refer to separately identified oligos where available;
      retain sequence text otherwise. Neither missing primer identity nor a product may be invented.
    slots:
      - name
      - taxon_curie
      - reference_curies
      - cross_reference_dtos
      - forward_oligo_identifier
      - reverse_oligo_identifier
      - forward_primer_sequence
      - reverse_primer_sequence
      - primer_pair_template_description
    slot_usage:
      name:
        required: false
      taxon_curie:
        required: false

  NucleicAcidLibrary:
    is_a: SubmittedObject
    description: >-
      A separately identified library or collection carrying shared biological-source, vector and
      publication information. Includes assay libraries without asserting that all members are
      physical clones.
    slots:
      - name
      - taxon
      - references
      - cross_references
      - source_library_type
      - source_vector
      - source_vector_name
      - source_vector_type
      - source_cloning_sites
      - source_tissue
      - source_stage
      - source_tissue_free_text
      - source_stage_free_text
      - source_age
      - source_genetic_background
    slot_usage:
      name:
        required: false
      taxon:
        required: false

  NucleicAcidLibraryDTO:
    is_a: SubmittedObjectDTO
    description: >-
      Submission of a reusable source library. Inline NucleicAcidSourceDTO remains available when no
      separate library identity is supplied.
    slots:
      - name
      - taxon_curie
      - reference_curies
      - cross_reference_dtos
      - source_library_type_name
      - source_vector_identifier
      - source_vector_name
      - source_vector_type_name
      - source_cloning_sites
      - source_tissue_curie
      - source_stage_curie
      - source_tissue_free_text
      - source_stage_free_text
      - source_age
      - source_genetic_background_identifier
    slot_usage:
      name:
        required: false
      taxon_curie:
        required: false

slots:

  nucleic_acid_reagent_type:
    description: 'The provider-supported material subtype, such as EST for a confirmed cDNA
      clone. Proposed CV: Nucleic Acid Reagent Type.'
    range: VocabularyTerm

  nucleic_acid_reagent_type_name:
    description: 'Name of the runtime VocabularyTerm for the provider-supported material subtype,
      such as EST for a confirmed cDNA clone. Proposed CV: Nucleic Acid Reagent Type.'
    range: string

  nucleic_acid_reagent_synonyms:
    description: Alternative names with per-name evidence and metadata.
    range: NucleicAcidReagentSynonymSlotAnnotation
    multivalued: true

  nucleic_acid_reagent_synonym_dtos:
    description: Inline alternative name annotations retaining each name’s evidence and metadata.
    range: NameSlotAnnotationDTO
    multivalued: true
    inlined: true
    inlined_as_list: true

  generated_by_identifiers:
    description: Source identifiers of the Agents that generated the material. Match generated_by
      cardinality; Agent identifier resolution remains a downstream implementation requirement.
    range: string
    multivalued: true

  nucleic_acid_sources:
    description: Library memberships and source-scoped provenance. Retain multiple memberships
      and their original scopes.
    range: NucleicAcidSource
    multivalued: true
    inlined: true
    inlined_as_list: true

  nucleic_acid_source_dtos:
    description: Ingest details for library memberships and source-scoped provenance. Retain
      multiple memberships and their original scopes.
    range: NucleicAcidSourceDTO
    multivalued: true
    inlined: true
    inlined_as_list: true

  reagent_sequences:
    description: Sequence evidence describing this material or sequence record; each sequence retains its own
      role and source identifier.
    range: ReagentSequence
    multivalued: true
    inlined: true
    inlined_as_list: true

  reagent_sequence_dtos:
    description: Ingest details for sequence evidence describing this material or sequence record; each sequence
      retains its own role and source identifier.
    range: ReagentSequenceDTO
    multivalued: true
    inlined: true
    inlined_as_list: true

  reagent_availability:
    description: 'Source-reported material availability. Proposed CV: Reagent Availability;
      available, not available and unknown are distinct. Being unavailable does not make a
      sequence record a material.'
    range: VocabularyTerm

  reagent_availability_name:
    description: 'Name of the runtime VocabularyTerm for source-reported material availability.
      Proposed CV: Reagent Availability; available, not available and unknown are distinct.
      Being unavailable does not make a sequence record a material.'
    range: string

  single_nucleic_acid_reagent:
    description: The nucleic-acid material or preparation to which a name applies.
    range: NucleicAcidReagent
    required: true

  clone_insert_origin:
    description: 'Origin of the insert in a confirmed DNA clone, separate from reagent subtype.
      Proposed CV: Clone Insert Origin; cDNA (derived by reverse transcription of RNA) or
      genomic DNA (derived from genomic DNA). Optional; an absent value represents unknown
      or unspecified origin, without requiring an unknown vocabulary term. An EST designation
      alone does not establish insert origin.'
    range: VocabularyTerm
    required: false
    multivalued: false

  clone_insert_origin_name:
    description: 'Name of the runtime VocabularyTerm for clone insert origin, separate from
      nucleic_acid_reagent_type_name. Proposed CV: Clone Insert Origin; cDNA or genomic DNA.
      Omit when origin is unknown or unspecified, allowing a null value in persistence.'
    range: string
    required: false
    multivalued: false

  clone_vector_name:
    description: Name of the vector known for this clone; do not copy a library-scoped vector
      here without source support.
    range: string

  clone_vector_type:
    description: 'Vector type recorded for this clone. Proposed CV: Clone Vector Type. Preserve
      unspecified and not applicable as distinct source values.'
    range: VocabularyTerm

  clone_vector_type_name:
    description: 'Name of the runtime VocabularyTerm for vector type recorded for this clone.
      Proposed CV: Clone Vector Type. Preserve unspecified and not applicable as distinct
      source values.'
    range: string

  clone_insert_length:
    description: Reported length of this clone insert in bases, excluding vector sequence.
      Omit when unknown.
    range: integer
    minimum_value: 1

  clone_cloning_sites:
    description: Cloning or restriction sites recorded for the individual clone, retaining
      source text.
    range: string
    multivalued: true

  forward_primer_sequence:
    description: The forward primer sequence in the source-reported 5-prime to 3-prime orientation.
      Optional for legacy PCR products; do not infer missing sequence.
    range: string

  reverse_primer_sequence:
    description: The reverse primer sequence in the source-reported 5-prime to 3-prime orientation.
      Optional for legacy PCR products.
    range: string

  pcr_assay_conditions:
    description: Source-reported PCR conditions as text.
    range: string

  pcr_template_description:
    description: Source-reported template and genetic background for this product. Distinguish
      different template contexts even when primer sequences match.
    range: string

  pcr_assay_method:
    description: 'The method used to generate this PCR product. Proposed CV: PCR Assay Method.'
    range: VocabularyTerm

  pcr_assay_method_name:
    description: 'Name of the runtime VocabularyTerm for the method used to generate this
      PCR product. Proposed CV: PCR Assay Method.'
    range: string

  pcr_template_source_identifiers:
    description: Original source identifiers of the template or its background, qualified
      by source object type where needed. Preserved provenance, not evidence of an implemented
      identifier resolver.
    range: string
    multivalued: true

  derived_from_reagents:
    description: Separately identified nucleic-acid reagents used as templates or starting
      materials for this reagent.
    range: NucleicAcidReagent
    multivalued: true

  derived_from_reagent_identifiers:
    description: Primary external IDs or provider-qualified internal IDs of separately submitted
      nucleic-acid reagents used as starting materials for this reagent.
    range: string
    multivalued: true

  source_template_identifiers:
    description: Original identifiers for source templates that do not yet have an Alliance
      material representation, for example an MGI non-cloned probe. Preserve them without
      creating placeholder clone or PCR product identities.
    range: string
    multivalued: true

  preparation_assay_identifier:
    description: Provider-qualified source assay identifier when the preparation is owned
      by one assay. It does not claim a shared reusable preparation or an Alliance expression
      experiment identifier.
    range: string

  probe_nucleic_acid_type:
    description: 'Chemical type of the prepared probe, for example DNA or RNA. Proposed CV:
      Probe Nucleic Acid Type.'
    range: VocabularyTerm

  probe_nucleic_acid_type_name:
    description: 'Name of the runtime VocabularyTerm for chemical type of the prepared probe,
      for example DNA or RNA. Proposed CV: Probe Nucleic Acid Type.'
    range: string

  probe_strand_orientation:
    description: 'Sense or antisense orientation of the preparation relative to its target.
      Proposed CV: Probe Strand Orientation.'
    range: VocabularyTerm

  probe_strand_orientation_name:
    description: 'Name of the runtime VocabularyTerm for sense or antisense orientation of
      the preparation relative to its target. Proposed CV: Probe Strand Orientation.'
    range: string

  probe_labels:
    description: 'Labels attached to the preparation. Proposed CV: Probe Label.'
    range: VocabularyTerm
    multivalued: true

  probe_label_names:
    description: 'Names of the runtime VocabularyTerms for labels attached to the preparation.
      Proposed CV: Probe Label.'
    range: string
    multivalued: true

  probe_visualization_methods:
    description: 'Methods used to visualize the prepared probe in the source assay. Proposed
      CV: Probe Visualization Method.'
    range: VocabularyTerm
    multivalued: true

  probe_visualization_method_names:
    description: 'Names of the runtime VocabularyTerms for methods used to visualize the prepared
      probe in the source assay. Proposed CV: Probe Visualization Method.'
    range: string
    multivalued: true

  probe_polymerase:
    description: 'Polymerase recorded for preparation of this probe. Proposed CV: Nucleic
      Acid Polymerase.'
    range: VocabularyTerm

  probe_polymerase_name:
    description: 'Name of the runtime VocabularyTerm for polymerase recorded for preparation
      of this probe. Proposed CV: Nucleic Acid Polymerase.'
    range: string

  source_library_identifier:
    description: Primary external or provider-qualified internal identifier resolving to a separately submitted NucleicAcidLibrary. Omit when only inline provenance is available.
    range: string

  source_library_name:
    description: Original name of the source library or collection.
    range: string

  source_library_type:
    description: Original source classification of this library, for example reagent collection
      or assay dataset.
    range: VocabularyTerm

  source_library_membership_relation:
    description: Original relation between this reagent and its source library, such as member_of_reagent_collection.
    range: VocabularyTerm

  source_vector_name:
    description: Vector name recorded for this library membership; do not promote it to a
      clone-specific fact.
    range: string

  source_tissue:
    description: Anatomical ontology term for the biological source tissue; FlyBase uses FBbt terms through DAOTerm.
    range: AnatomicalTerm

  source_stage:
    description: Developmental-stage ontology term for the biological source; FlyBase uses FBdv terms through FBDVTerm.
    range: StageTerm

  source_age:
    description: Age of the biological material from which the nucleic acid originated,
      preserving the source wording separately from developmental stage.
    range: string

  source_genetic_background:
    description: Affected genomic model representing the genetic background of the
      biological material from which the nucleic acid originated, rather than the
      cloning or propagation host.
    range: AffectedGenomicModel

  source_genetic_background_identifier:
    description: Curie or internal identifier of the affected genomic model representing
      the genetic background of the biological source material. Resolves to
      source_genetic_background; does not identify the cloning or propagation host.
    range: string

  source_vector_type:
    description: 'Vector type recorded for this source library. Proposed CV: Clone Vector
      Type.'
    range: VocabularyTerm

  source_vector_type_name:
    description: 'Name of the runtime VocabularyTerm for vector type recorded for this source
      library. Proposed CV: Clone Vector Type.'
    range: string

  source_cloning_sites:
    description: Cloning sites recorded at source-library scope.
    range: string
    multivalued: true

  reagent_sequence_source_identifier:
    description: Provider-qualified identifier of the source sequence record; not the material
      identifier.
    range: string

  reagent_sequence_accessions:
    description: External sequence accessions including version when the source supplies it.
    range: string
    multivalued: true

  reagent_sequence_residues:
    description: Source-supplied nucleotide sequence in its recorded orientation. No residues
      are invented from an accession alone.
    range: string

  reagent_sequence_role:
    description: 'Role of this sequence evidence, for example full insert, 5-prime EST, 3-prime
      EST or clone end. Proposed CV: Reagent Sequence Role.'
    range: VocabularyTerm

  reagent_sequence_role_name:
    description: 'Name of the runtime VocabularyTerm for role of this sequence evidence, for
      example full insert, 5-prime EST, 3-prime EST or clone end. Proposed CV: Reagent Sequence
      Role.'
    range: string

  nucleic_acid_reagent_association_subject:
    description: A nucleic-acid material, primer-pair definition or sequence record. The historical slot name also covers the explicitly listed nonmaterial classes.
    range: SubmittedObject
    any_of:
      - range: NucleicAcidReagent
      - range: PrimerPair
      - range: NucleicAcidSequenceRecord
    required: true

  nucleic_acid_reagent_genomic_entity_association_object:
    description: The genomic entity related to this material, preserving gene, transcript,
      CDS or variant identity.
    range: GenomicEntity
    required: true

  nucleic_acid_reagent_identifier:
    description: Primary external ID or provider-qualified internal ID used to submit the
      nucleic-acid reagent, PrimerPair or NucleicAcidSequenceRecord.
    range: string
    required: true

  source_association_identifier:
    description: Provider-qualified original association identifier, where supplied; not a
      newly minted public ID.
    range: string

  reagent_association_source_relation:
    description: Exact original relationship value, including an empty string when that is
      the original encoding. Omission means not supplied; notes can record SQL NULL or other
      missing-value encodings.
    range: string

  reagent_association_method:
    description: Method supporting this particular relationship, for example AEVAST with BLAST.
      Absence does not imply manual curation.
    range: VocabularyTerm

  reagent_association_method_version:
    description: Recorded method version. Omit when unrecorded, including FlyBase AEVAST links
      for which no version was retained.
    range: string

  reagent_association_source_release:
    description: Source release of this relationship and its computational derivation, where
      known.
    range: string

  supporting_sequence_identifiers:
    description: Original identifiers of sequences supporting this relationship; retain accessions
      or provider-qualified source IDs even when no separate sequence entity has been loaded.
    range: string
    multivalued: true

  supporting_transcript_identifiers:
    description: Transcript identifiers on the derivation path to a gene association. A derived
      gene link must not erase its transcript-level support.
    range: string
    multivalued: true

  source_tissue_curie:
    description: >-
      CURIE resolving to the ontology term for source tissue.
    range: string

  source_tissue_free_text:
    description: >-
      Original source tissue wording when no suitable ontology mapping has been established; do not
      put free text in the ontology reference.
    range: string

  source_stage_curie:
    description: >-
      CURIE resolving to the ontology term for source stage.
    range: string

  source_stage_free_text:
    description: >-
      Original source stage wording when no suitable ontology mapping has been established; do not
      put free text in the ontology reference.
    range: string

  source_library_type_name:
    description: >-
      Name of a runtime VocabularyTerm in the proposed Library Type vocabulary. Ontology-backed and
      local terms may coexist.
    range: string

  source_library_membership_relation_name:
    description: >-
      Name of a runtime VocabularyTerm in the proposed Library Membership Relation vocabulary.
      Ontology-backed and local terms may coexist.
    range: string

  reagent_association_method_name:
    description: >-
      Name of a runtime VocabularyTerm in the proposed Reagent Association Method vocabulary.
      Ontology-backed and local terms may coexist.
    range: string

  clone_vector:
    description: >-
      Identified vector used for this clone. Keep clone_vector_name when only a name is known.
    range: Construct

  clone_vector_identifier:
    description: >-
      Primary external or provider-qualified internal ID of the vector Construct.
    range: string

  source_vector:
    description: >-
      Identified vector at source-library scope, not evidence about an individual insert.
    range: Construct

  source_vector_identifier:
    description: >-
      Identifier resolving to the source-library vector Construct.
    range: string

  source_library:
    description: >-
      Reusable library for this membership. Keep member-specific provenance on this source detail.
    range: NucleicAcidLibrary

  clone_collection_statuses:
    description: >-
      Source-supported collection designations. Proposed CV Clone Collection Status includes BDGP
      and DGC gold; these are not availability states.
    range: VocabularyTerm
    multivalued: true

  clone_collection_status_names:
    description: >-
      Runtime vocabulary names for the collection designations of this clone.
    range: string
    multivalued: true

  clone_known_problems:
    description: >-
      Source-reported clone problems, preserving the original wording.
    range: string
    multivalued: true

  clone_assessment:
    description: >-
      Curator assessment of the clone, preserving the original wording.
    range: string

  replaces_clones:
    description: >-
      Earlier clones superseded by this clone. Replacement is distinct from biological derivation.
    range: DNAClone
    multivalued: true

  replaces_clone_identifiers:
    description: >-
      Identifiers of separately submitted clones superseded by this clone.
    range: string
    multivalued: true

  pcr_primer_pair:
    description: >-
      Primer-pair definition used to generate this product; template context remains separate.
    range: PrimerPair

  pcr_primer_pair_identifier:
    description: >-
      Identifier of the separately submitted PrimerPair for this product.
    range: string

  reagent_primer_pairs:
    description: >-
      Primer-pair definitions associated with preparing or using this reagent. This does not assert
      that the reagent is a PCR product.
    range: PrimerPair
    multivalued: true

  reagent_primer_pair_identifiers:
    description: >-
      Identifiers of primer-pair definitions used in reagent preparation or use.
    range: string
    multivalued: true

  reagent_preparation_protocol:
    description: >-
      Source preparation or use instructions, including source-supplied protocol URLs. Instructions
      do not establish a separate preparation identity.
    range: string

  sequence_record_type:
    description: >-
      Classification of the sequence record. Proposed CV Sequence Record Type includes read anchor
      and sequence record.
    range: VocabularyTerm

  sequence_record_type_name:
    description: >-
      Runtime term name in Sequence Record Type.
    range: string

  oligo_sequence:
    description: >-
      Source-reported oligonucleotide sequence in its recorded 5-prime to 3-prime orientation.
    range: string

  oligo_chemical_type:
    description: >-
      Oligonucleotide chemistry. Proposed CV Probe Nucleic Acid Type; DNA, RNA and modified or mixed
      chemistry require explicit source support.
    range: VocabularyTerm

  oligo_chemical_type_name:
    description: >-
      Runtime vocabulary name for oligonucleotide chemistry.
    range: string

  oligo_modifications:
    description: >-
      Chemical modifications on the oligonucleotide. Proposed CV Oligo Modification may combine
      ontology-backed and local terms; positions require future structured support.
    range: VocabularyTerm
    multivalued: true

  oligo_modification_names:
    description: >-
      Runtime vocabulary names for reported oligonucleotide modifications.
    range: string
    multivalued: true

  oligo_sequence_context:
    description: >-
      Source-supported origin of primer sequence portions. Proposed CV Oligo Sequence Context
      includes insert, vector, mixed and unspecified; not inferred from a genomic label.
    range: VocabularyTerm

  oligo_sequence_context_name:
    description: >-
      Runtime term name for source-supported insert, vector or mixed sequence context.
    range: string

  forward_oligo:
    description: >-
      Separately identified forward primer oligonucleotide.
    range: Oligo

  reverse_oligo:
    description: >-
      Separately identified reverse primer oligonucleotide.
    range: Oligo

  forward_oligo_identifier:
    description: >-
      Identifier of the separately submitted forward Oligo.
    range: string

  reverse_oligo_identifier:
    description: >-
      Identifier of the separately submitted reverse Oligo.
    range: string

  primer_pair_template_description:
    description: >-
      Source description of the intended template or genetic background; not an observation of an
      amplified product.
    range: string
