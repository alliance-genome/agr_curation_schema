id: https://github.com/alliance-genome/agr_curation_schema/biologicalEntitySet.yaml
name: Alliance-Schema-Prototype-Biological-Entity-Set
title: Alliance Schema Prototype Biological Entity Set
description: Alliance Biological Entity Set Prototype with LinkML

default_prefix: alliance
default_range: string

default_curi_maps:
  - obo_context
  - idot_context
  - semweb_context
  - monarch_context

emit_prefixes:
  - rdf
  - rdfs
  - xsd

imports:
  - core
  - linkml:types
  - gene

prefixes:
  alliance: 'http://alliancegenome.org/'
  linkml: 'https://w3id.org/linkml/'
  gff: 'https://w3id.org/gff'
  faldo: 'http://biohackathon.org/resource/faldo#'
  biolink: 'https://w3id.org/biolink/vocab/'
  NLMID: 'https://www.ncbi.nlm.nih.gov/nlmcatalog/?term='
  schema: 'http://schema.org/'
  dct: 'http://purl.org/dc/terms/'
  WIKIDATA_PROPERTY: 'https://www.wikidata.org/wiki/Property:'
  obograph: 'https://github.com/biodatamodels/obograph'
  MSigDB: 'https://this_needs_a_defining_uri'

## ------------
## CLASSES
## ------------



classes:

# Do BiologicalEntitySets have unique identifier or unique name?
#   If not, do these sets have a set of identifying slots that determine uniqueness of the set.
# Metadata for Feature-BiologicalEntitySets relationship?
# Types of BiologicalEntitySets
# Attributes shared/specific to each type of BiologicalEntitySets.

  BiologicalEntitySet:
    description: >-
      A named group of biological entities assembled because its members share a
      biological property, function, or context.
    is_a: SubmittedObject
    abstract: true
    notes: >-
      Deliberately parented on SubmittedObject rather than BiologicalEntity, as
      BiologicalEntity requires a single taxon and a set may span multiple taxa.
    slots:
      - taxon
      - full_name
      - symbol
      - set_synonyms
      - set_go_mf_terms
      - set_go_bp_terms
      - set_go_cc_terms
      - parent_sets
      - related_sets
      - cross_references
      - secondary_identifiers
    slot_usage:
      taxon:
        description: >-
          This slot is optional - it should not be used if multiple taxa are
          represented in the set.
        required: false
      full_name:
        required: true

  BiologicalEntitySetDTO:
    description: >-
      Ingest class for named groups of biological entities assembled because their
      members share a biological property, function, or context.
    is_a: SubmittedObjectDTO
    abstract: true
    slots:
      - taxon_curie
      - full_name
      - symbol
      - set_synonym_dtos
      - set_go_mf_term_curies
      - set_go_bp_term_curies
      - set_go_cc_term_curies
      - parent_set_identifiers
      - related_set_identifiers
      - cross_reference_dtos
      - secondary_identifiers
    slot_usage:
      taxon_curie:
        description: >-
          This slot is optional - it should not be used if multiple taxa are
          represented in the set.
        required: false
      full_name:
        required: true

  GeneCluster:
    description: >-
      A gene cluster is a set of genes which have a biological significance, and
      which are probably clustered together on the genome, like histones and miRNAs
    is_a: SubmittedObject
    slots:
      - genes
      - related_note

  GeneCollection:
    description: >-
      A gene collection is a set of genes which have been grouped based on experimental evidence, for example a set of interacting genes, genes in expression cluster, or a set of ChIP binding peaks
    is_a: SubmittedObject
    slots:
      - genes
      - related_note
      - experiment_type
      # maybe we want a slot for a GO evidence code here?

  GeneNomenclatureSet:
    description: >-
      WB specific. A gene class is a set of genes which share nomenclature, belonging to the same gene class.
    is_a: AuditedObject
    slots:
      - genes
      - curie
      - designating_laboratory
      - old_members
      - synonyms
      - related_note

  Operon:
    description: >-
      The DNA region of a group of adjacent genes whose transcription is
      coordinated on one or several mutually overlapping transcription
      units transcribed in the same direction and sharing at least one gene.
    is_a: SubmittedObject
    slots:
      - genes
      - related_note
      # - history # Tracking the history of merges/splits/previous members - deal with later
    exact_mappings:
      - SO:0000178

  UniGeneSet:
    description: >-
      XenBase-specific. A set of three genes from X. tropicalis and X. laevis (S and L forms)
      representing a single unigene.
    is_a: SubmittedObject
    slots:
      - genes

  FunctionalGeneSet:
    description: >-
      Families and groups of genes related by sequence and/or function.
    is_a: BiologicalEntitySet
    slots:
      - gene_functional_gene_set_associations
    slot_usage:
      parent_sets:
        range: FunctionalGeneSet

  Pathway:
    description: >-
      A series of molecular interactions and reactions occurring within a cell or
      organism that brings about a particular biological outcome.
    is_a: BiologicalEntitySet
    notes: >-
      Each pathway is expected to carry exactly one related_note of type 'summary',
      giving a curator-written textual description of the pathway. This cannot be
      expressed in the schema, as LinkML cannot require a note of a particular type,
      and so is enforced at load.
    slots:
      - pathway_type
      - pathway_image_filename
      - gene_pathway_associations
    slot_usage:
      parent_sets:
        range: Pathway
    exact_mappings:
      - biolink:Pathway
      - PW:0000001
      - WIKIDATA:Q4915012
    id_prefixes:
      - GO
      - REACT
      - KEGG
      - SMPDB
      - MSigDB
      - PHARMGKB.PATHWAYS
      - WIKIPATHWAYS
      - FB  # FlyBase FBgg*
      - PANTHER.PATHWAY
      - KEGG.PATHWAY

  ProteinComplex:
    is_a: SubmittedObject
    slots:
      - proteins


  GenePathwayAssociation:
    description: >-
      Association between a gene and a pathway, with supporting references that
      demonstrate or state the gene's participation in the pathway.
    is_a: EvidenceAssociation
    slots:
      - gene_association_subject
    attributes:
      gene_pathway_association_object:
        range: Pathway
        required: true
    slot_usage:
      relation:
        subproperty_of: participates_in
        notes: >-
          CV 'Gene Pathway Association Relation' including - participates_in

  GeneFunctionalGeneSetAssociation:
    description: >-
      Association between a gene and a functional gene set, with supporting references
      that demonstrate or state the gene's membership in the set.
    is_a: EvidenceAssociation
    slots:
      - gene_association_subject
    attributes:
      gene_functional_gene_set_association_object:
        range: FunctionalGeneSet
        required: true
    slot_usage:
      relation:
        subproperty_of: is_member_of
        notes: >-
          CV 'Gene Functional Gene Set Association Relation' including - is_member_of

  BiologicalEntitySetSynonymSlotAnnotation:
    is_a: NameSlotAnnotation
    description: >-
      All aliases (non-preferred names) for the biological entity set. Acceptable synonym
      types are full_name, nomenclature_symbol, and unspecified
    slots:
      - single_biological_entity_set
    slot_usage:
      single_biological_entity_set:
        required: true

  FunctionalGeneSetDTO:
    is_a: BiologicalEntitySetDTO
    description: >-
      Ingest class for functional gene sets (families and groups of genes
      related by sequence and/or function).

  PathwayDTO:
    is_a: BiologicalEntitySetDTO
    description: >-
      Ingest class for pathways (series of molecular interactions and reactions
      occurring within a cell or organism that bring about a particular
      biological outcome).
    slots:
      - pathway_type_curie
      - pathway_image_filename

  GenePathwayAssociationDTO:
    description: >-
      Ingest class for association between a gene and a pathway, with supporting
      references that demonstrate or state the gene's participation in the
      pathway.
    is_a: EvidenceAssociationDTO
    slots:
      - gene_identifier
      - relation_name
    attributes:
      pathway_identifier:
        description: >-
          Identifier (curie/primary_external_id/mod_internal_id) of the pathway
        range: string
        required: true

  GeneFunctionalGeneSetAssociationDTO:
    description: >-
      Ingest class for association between a gene and a functional gene set,
      with supporting references that demonstrate or state the gene's
      membership in the set.
    is_a: EvidenceAssociationDTO
    slots:
      - gene_identifier
      - relation_name
    attributes:
      functional_gene_set_identifier:
        description: >-
          Identifier (curie/primary_external_id/mod_internal_id) of the
          functional gene set
        range: string
        required: true

## ------------
## SLOTS
## ------------



slots:

  proteins:
    multivalued: true
    range: Protein

  genes:
    multivalued: true
    range: Gene
    # Would you have an object for a set of orthologous genes?  Or leave these to be generated
    # from code that says: get me all the orthologs of geneX where geneX is a member of GeneToGeneOrthology Association

  paralogous_genes:
    is_a: genes

  has_participant:
    exact_mappings:
      - RO:0000057

  participates_in:
    description: >-
      Indicates participation of a gene in a pathway. Inverse of has_participant;
      used because the subject of a GenePathwayAssociation is the gene, not the
      pathway.
    exact_mappings:
      - RO:0000056

  has_input:
    is_a: has_participant

  has_output:
    is_a: has_participant

  enables:
    is_a: has_participant

  designating_laboratory:
    description: >-
      A laboratory which designated this gene class
    required: true
    multivalued: false
    domain: Gene
    range: Laboratory

  old_members:
    description: >-
      Gene which were formerly members of this GeneClass
    required: false
    multivalued: true
    domain: GeneNomenclatureSet
    range: Gene  

  experiment_type:
    description: >-
      Type of experiment by which these genes were collated eg chip-seq, interaction, expression
    required: false
    multivalued: true
    domain: GeneCollection
    range: string  # should maybe be replaced by a vocabulary

  set_go_mf_terms:
    description: >-
      Key Gene Ontology Molecular Function terms associated with this set.
    range: GOTerm
    multivalued: true

  set_go_bp_terms:
    description: >-
      Key Gene Ontology Biological Process terms associated with this set.
    range: GOTerm
    multivalued: true

  set_go_cc_terms:
    description: >-
      Key Gene Ontology Cellular Component terms associated with this set.
    range: GOTerm
    multivalued: true

  set_synonyms:
    description: >-
      Synonyms for the biological entity set.
    domain: BiologicalEntitySet
    range: BiologicalEntitySetSynonymSlotAnnotation
    multivalued: true

  single_biological_entity_set:
    range: BiologicalEntitySet
    multivalued: false

  parent_sets:
    description: >-
      Parent set(s) of which this set is a subset.
    range: BiologicalEntitySet
    multivalued: true

  related_sets:
    description: >-
      Other related sets.
    range: BiologicalEntitySet
    multivalued: true

  pathway_type:
    description: >-
      The type of biological process that the pathway represents, given as a
      top-level term from the Pathway Ontology (PW).
    domain: Pathway
    range: PWTerm
    required: true
    multivalued: false
    notes: >-
      Expected to be one of the five top-level PW terms - classic metabolic pathway
      (PW:0000002), signaling pathway (PW:0000003), regulatory pathway (PW:0000004),
      disease pathway (PW:0000013), or drug pathway (PW:0000754). PW is the canonical
      Alliance representation of pathway type; MOD-native classifications of the same
      concept (e.g. the FlyBase FBcv pathway group terms) are deliberately not captured.

  pathway_type_curie:
    description: >-
      CURIE of the top-level Pathway Ontology (PW) term representing the type of
      biological process that the pathway represents - one of PW:0000002 (classic
      metabolic pathway), PW:0000003 (signaling pathway), PW:0000004 (regulatory
      pathway), PW:0000013 (disease pathway), or PW:0000754 (drug pathway).
    domain: PathwayDTO
    range: string
    required: true
    multivalued: false

  pathway_image_filename:
    description: >-
      Filename of an image file depicting the pathway.
    range: string
    required: false
    multivalued: false
    notes: >-
      INTERIM - this slot records only a bare filename, with no accompanying
      definition of where the file is stored or how a consumer resolves the name
      to a retrievable image. The Alliance has no general mechanism for
      submitting or hosting image files - the File class in image.yaml is a
      placeholder with no slots, and there are no Image/Figure/File ingest
      classes. To be revisited with the image working group, at which point this
      slot should be replaced by a proper reference to an Image entity.

  gene_pathway_associations:
    description: >-
      Gene participants in this pathway, with supporting evidence/references.
    domain: Pathway
    range: GenePathwayAssociation
    multivalued: true

  gene_functional_gene_set_associations:
    description: >-
      Gene members of this functional gene set, with supporting evidence/references.
    domain: FunctionalGeneSet
    range: GeneFunctionalGeneSetAssociation
    multivalued: true

  is_member_of:
    description: >-
      Indicates membership of a gene in a functional gene set.
    exact_mappings:
      - RO:0002350

  set_synonym_dtos:
    description: >-
      Synonyms for the biological entity set.
    domain: BiologicalEntitySetDTO
    range: NameSlotAnnotationDTO
    multivalued: true
    inlined: true
    inlined_as_list: true

  set_go_mf_term_curies:
    description: >-
      CURIEs of key Gene Ontology Molecular Function terms associated with
      this set.
    range: string
    multivalued: true

  set_go_bp_term_curies:
    description: >-
      CURIEs of key Gene Ontology Biological Process terms associated with
      this set.
    range: string
    multivalued: true

  set_go_cc_term_curies:
    description: >-
      CURIEs of key Gene Ontology Cellular Component terms associated with
      this set.
    range: string
    multivalued: true

  parent_set_identifiers:
    description: >-
      Identifiers (curie/primary_external_id/mod_internal_id) of parent
      set(s) of which this set is a subset.
    range: string
    multivalued: true

  related_set_identifiers:
    description: >-
      Identifiers (curie/primary_external_id/mod_internal_id) of other
      related sets.
    range: string
    multivalued: true

