id: https://github.com/alliance-genome/agr_curation_schema/src/schema/person

default_prefix: alliance
default_range: string

default_curi_maps:
  - obo_context
  - idot_context
  - semweb_context
  - monarch_context

emit_prefixes:
  - rdf
  - rdfs
  - xsd

imports:
  - linkml:types
  - core
  - allianceMember
  - resourceDescriptor

prefixes:
  alliance: 'http://alliancegenome.org/'
  linkml: 'https://w3id.org/linkml/'
  gff: 'https://w3id.org/gff'
  faldo: 'http://biohackathon.org/resource/faldo#'
  biolink: 'https://w3id.org/biolink/vocab/'
  NLMID: 'https://www.ncbi.nlm.nih.gov/nlmcatalog/?term='
  schema: 'http://schema.org/'

classes:

  Agent:
    is_a: CurieObject
    description: >-
      An individual, group, organization, project, or automated process that
      provides information and/or materials. Subclass of CurieObject, with
      curie as the identifier for all agents so that non-inlined Agent
      references (created_by, updated_by, generated_by, ...) serialize as
      the identifier string.
    close_mappings:
      - biolink:agent
    slot_usage:
      curie:
        identifier: true
        description: >-
          The agent's identifier: for persons the MATI-minted AGRKB curie;
          for automated agents the agent's stable name (not MATI-minted);
          for organizations the organization's curie.

  Organization:
    is_a: Agent
    description: >-
      An organization that provides information and/or materials to the Alliance.
      This includes Alliance member organizations (see AllianceMember subclass).
    slots:
      - abbreviation
      - full_name
      - short_name
      - homepage_resource_descriptor_page
    slot_usage:
      full_name:
        required: true
        description: >-
          The full name of the Organization.
          e.g. Mouse Genome Database, FlyBase, Online Mendelian Inheritance of Man
      short_name:
        required: true
        description: >-
          The short name of the organization. For Alliance Members, this is the short name
          used in the Members list on the website. e.g. MGD, FB, OMIM


  Laboratory:
    is_a: Organization

  Company:
    is_a: Organization

  AutomatedAgent:
    is_a: Agent
    description: >-
      An automated agent -- a pipeline, load script, or other software
      process -- that creates or modifies records. Its curie is simply its
      stable name, used as-is (e.g. ACKnowledge_pipeline): automated agents
      are not registered with MATI. Covers e.g. the ABC's automation users
      (users without a person_id).
    slots:
      - evidence_code
    slot_usage:
      curie:
        description: >-
          Stable name of the automated agent (e.g. ACKnowledge_pipeline);
          not MATI-minted.
      evidence_code:
        description: >-
          Default ECO term for assertions produced by this agent (e.g. an
          automated-assertion evidence code); an annotation's own evidence
          code takes precedence where present.

  Person:
    is_a: Agent
    slots:
      - last_name
      - middle_name
      - first_name
      - orcid
      - emails
      - old_emails
      - primary_external_id
      - secondary_identifiers
      - unique_id
      - affiliated_alliance_member
    exact_mappings:
      - schema:person
      - foaf:Person
    slot_usage:
      curie:
        description: >-
          The AGRKB curie of the person (the identifier inherited from
          Agent), minted by MATI; the shared person identifier across the
          Alliance curation systems and the ABC.
      primary_external_id:
        description: >-
          The person's primary MOD person id (e.g. WB:WBPerson002314) when a
          MOD is the authority for the person record; additional or legacy
          ids go in secondary_identifiers.
      secondary_identifiers:
        description: >-
          Other identifiers the person is known by beyond curie and
          primary_external_id, e.g. additional or legacy MOD person ids.
      unique_id:
        description: >-
          Legacy non-curie identifier (systematic concatenation of defining
          properties); retained during the transition to curie as the person
          identifier.
    unique_keys:
      legacy_unique_id:
        description: >-
          unique_id is no longer the identifier but legacy consumers still
          key on it; keep it unique through the transition.
        unique_key_slots:
          - unique_id

  LoggedInPerson:
    is_a: Person
    description: >-
      A Person who can authenticate to an Alliance curation system. Identity
      is the person's AGRKB curie (the inherited curie slot); the
      authentication slots tie the person to an external authentication
      provider and are deliberately provider-agnostic (Okta, Cognito, ...).
    slots:
      - auth_id
      - auth_email
      - user_settings
      - api_token
    slot_usage:
      auth_id:
        required: true

slots:

  affiliated_alliance_member:
    description: The Alliance Member the person is affiliated with
    domain: Person
    range: AllianceMember

  orcid:
    description:  Open Researcher and Contributor ID
    domain: Person
    range: uriorcurie
    multivalued: false

  emails:
    description: list of emails for a person
    multivalued: true
    range: string

  old_emails:
    description: list of old (outdated) emails for a person
    multivalued: true
    range: string

  auth_id:
    aliases: ['okta_id']
    description: >-
      The person's subject identifier in the external authentication
      provider (e.g. Okta, Cognito; replaces the former okta_id).
    domain: LoggedInPerson
    range: string
    multivalued: false

  auth_email:
    aliases: ['okta_email']
    description: >-
      The email address registered with the external authentication provider
      (replaces the former okta_email).
    domain: LoggedInPerson
    range: string
    multivalued: false

  user_settings:
    description: JSON Blob containing details of UI settings for LoggedInPerson
    domain: LoggedInPerson
    range: string
    multivalued: false

  api_token:
    description: The API token of the LoggedInPerson for the curation system
    domain: LoggedInPerson
    range: string

  homepage_resource_descriptor_page:
    description: >-
      ResourceDescriptorPage containing URL template for organization's
      homepage
    domain: Organization
    range: ResourceDescriptorPage
