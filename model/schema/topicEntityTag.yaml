id: https://github.com/alliance-genome/agr_curation_schema/src/schema/topicEntityTag

description: >-
  LinkML model of the ABC topic_entity_tag and topic_entity_tag_source tables
  (SCRUM-6452), covering every column, so consumers -- in particular the
  public-site search index generation -- have an authoritative shared shape
  for TET documents. Mirrors
  agr_literature_service/api/models/topic_entity_tag_model.py.

  Slot names are the ABC column names, which are also the JSON keys of TET
  documents (an external contract with the search-index consumers). Slots
  shared with the rest of the model (created_by, date_created, negated,
  reference_id, reference_curie, entity_type, data_provider) are reused from
  core/reference and contextually refined per class via slot_usage.

default_prefix: alliance
default_range: string

prefixes:
  alliance: 'http://alliancegenome.org/'
  linkml: 'https://w3id.org/linkml/'
  ATP: 'http://purl.obolibrary.org/obo/ATP_'
  NCBITaxon: 'http://purl.obolibrary.org/obo/NCBITaxon_'

imports:
  - linkml:types
  - core

classes:

  TopicEntityTag:
    description: >-
      One curated or machine-generated assertion that a reference is about a
      topic, optionally tied to a specific entity. The topic, entity_type,
      display_tag, data_novelty, and data_context values are ATP ontology
      curies; species is an NCBITaxon curie; entity is a MOD entity curie
      resolved through the Alliance persistent store.
    slots:
      - topic_entity_tag_id
      - reference_id
      - reference_curie
      - topic_entity_tag_source_id
      - topic
      - entity_type
      - entity
      - entity_id_validation
      - species
      - display_tag
      - negated
      - confidence_score
      - confidence_level
      - note
      - data_novelty
      - data_context
      - validation_by_author
      - validation_by_professional_biocurator
      - validated_by
      - ml_model_id
      - source
      - date_created
      - date_updated
      - created_by
      - updated_by
    slot_usage:
      reference_id:
        required: false
        description: >-
          Internal foreign key to the ABC reference table; may be omitted in
          public TET documents, which key on reference_curie.
      reference_curie:
        required: true
        description: >-
          The AGRKB curie of the tagged reference (e.g.
          AGRKB:101000000860007); the join of reference_id exposed by the API
          and the search index, and the usable reference key for public
          consumers.
      topic_entity_tag_source_id:
        description: Foreign key to the tag's TopicEntityTagSource.
      entity_type:
        description: >-
          ATP curie of the kind of entity tagged (e.g. ATP:0000005 gene,
          ATP:0000006 allele, ATP:0000027 strain). Present exactly when
          entity is present.
      negated:
        description: >-
          True when the tag asserts the reference is NOT about the
          topic/entity.
      date_created:
        required: true
        description: When the ABC row was created (stored UTC).
      date_updated:
        description: When the ABC row was last updated (stored UTC).
      created_by:
        description: >-
          ABC users.id of the creator: the Agent curie -- the person AGRKB
          curie (Person.curie) for person-backed users (users.person_id
          set), or an AutomatedAgent name (e.g. ACKnowledge_pipeline,
          auto-created ids from data loads) for automation users without a
          person_id.
      updated_by:
        description: >-
          ABC users.id of the last updater (an Agent curie; see created_by).
    rules:
      - description: >-
          entity_type, entity, and entity_id_validation are set together or
          not at all (check constraint valid_entity_type_dependencies); the
          ABC never stores an entity-type-only tag.
        preconditions:
          slot_conditions:
            entity:
              required: true
        postconditions:
          slot_conditions:
            entity_type:
              required: true
            entity_id_validation:
              required: true
      - description: A tag with an entity_type must name the entity.
        preconditions:
          slot_conditions:
            entity_type:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            entity:
              required: true
            entity_id_validation:
              required: true
      - description: A tag with an entity_id_validation must name the entity.
        preconditions:
          slot_conditions:
            entity_id_validation:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            entity:
              required: true
            entity_type:
              required: true

  TopicEntityTagSource:
    description: >-
      Where a family of tags comes from: the combination of evidence
      assertion, method, and data providers. Unique on
      (source_evidence_assertion, source_method, data_provider,
      secondary_data_provider).
    slots:
      - topic_entity_tag_source_id
      - source_evidence_assertion
      - source_method
      - validation_type
      - data_provider
      - secondary_data_provider_abbreviation
      - source_description
      - date_created
      - date_updated
      - created_by
      - updated_by
    slot_usage:
      topic_entity_tag_source_id:
        identifier: true
        description: Primary key of the topic_entity_tag_source row.
      data_provider:
        range: string
        description: >-
          MOD abbreviation of the group that generated the tags (e.g. SGD) --
          not an Organization reference.
      date_created:
        required: true
        description: When the ABC row was created (stored UTC).
      date_updated:
        description: When the ABC row was last updated (stored UTC).
      created_by:
        description: ABC users.id of the creator (an Agent curie).
      updated_by:
        description: ABC users.id of the last updater (an Agent curie).

slots:

  topic_entity_tag_id:
    description: Primary key of the topic_entity_tag row.
    identifier: true
    range: integer
    required: true

  topic_entity_tag_source_id:
    description: >-
      Identifier of a topic_entity_tag_source row (see slot_usage on the two
      classes: primary key on TopicEntityTagSource, foreign key on
      TopicEntityTag).
    range: integer
    required: true

  topic:
    description: >-
      ATP curie of the topic asserted for the reference (A-team ontology
      term id), e.g. ATP:0000005 (gene) for a pure entity tag or a
      descendant of ATP:0000002 for a subject topic.
    required: true

  entity:
    description: >-
      Curie of the tagged entity (e.g. SGD:S000002284, ZFIN:ZDB-ALT-...),
      resolved via the Alliance persistent store per entity_id_validation.

  entity_id_validation:
    description: >-
      How the entity curie was validated, e.g. "alliance". Present exactly
      when entity is present.

  species:
    description: NCBITaxon curie of the species the tag applies to.

  display_tag:
    description: >-
      ATP curie of the MOD display section the tag appears under on the
      public reference pages (e.g. ATP:0000147 primary display,
      ATP:0000130 review display).

  confidence_score:
    description: Classifier confidence score for machine-generated tags.
    range: float

  confidence_level:
    description: >-
      Classifier confidence bucket for machine-generated tags (in practice
      high / medium / low, compared case-insensitively).

  note:
    description: Free-text curator note on the tag.

  data_novelty:
    description: >-
      ATP curie stating whether the tagged data is novel: ATP:0000334
      (existing data), or a new-data term -- ATP:0000335 (new data) and its
      descendants ATP:0000321 (new data type), ATP:0000228 (new to
      database), ATP:0000229 (new to field).
    required: true

  data_context:
    description: >-
      ATP curie stating what kind of data the tag represents: ATP:0000323
      (data context) or one of its descendants -- ATP:0000325
      (experimentally studied data), ATP:0000360 (background information),
      ATP:0000328 (expression marker), ATP:0000327 (genetic marker). The
      root term ATP:0000323 itself marks tags whose specific context is
      unknown (backfilled rows).
    required: true

  validation_by_author:
    description: >-
      Rollup of author validations of this tag, computed from the
      validating tags.
    range: validation_value_enum

  validation_by_professional_biocurator:
    description: >-
      Rollup of professional-biocurator validations of this tag, computed
      from the validating tags.
    range: validation_value_enum

  validated_by:
    description: >-
      topic_entity_tag_ids of the tags validating this tag (the
      topic_entity_tag_validation association table).
    range: integer
    multivalued: true

  ml_model_id:
    description: >-
      Foreign key to the ml_model that produced a machine-generated tag;
      absent for manual tags.
    range: integer

  source:
    description: >-
      The tag's TopicEntityTagSource embedded inline -- for documents (e.g.
      the public search index) that carry the source's evidence assertion,
      method, and data providers next to the tag instead of joining on
      topic_entity_tag_source_id. When present it is the row
      topic_entity_tag_source_id points at.
    range: TopicEntityTagSource
    inlined: true

  source_evidence_assertion:
    description: >-
      ATP curie of the evidence assertion type, e.g. ATP:0000036 (assertion
      by professional biocurator), ATP:0000035 (author assertion), or an
      ML-method term for classifiers.
    required: true

  source_method:
    description: >-
      The system or pipeline that produced the tags, e.g.
      abc_literature_system, sgd_reference_curation, abc_entity_extractor.
    required: true

  validation_type:
    description: >-
      How tags from this source validate others (e.g. professional_biocurator,
      author); null for sources whose tags do not validate.

  secondary_data_provider_abbreviation:
    description: >-
      MOD abbreviation of the Alliance member responsible for the data
      (mod.abbreviation behind secondary_data_provider_id).
    required: true

  source_description:
    description: Human-readable description of the source.

enums:

  validation_value_enum:
    description: >-
      Computed validation rollup values (see
      calculate_validation_value_for_tag in topic_entity_tag_crud).
    permissible_values:
      validated_right:
        description: Validating tags agree with this tag.
      validated_wrong:
        description: Validating tags contradict this tag.
      validated_right_self:
        description: The tag validates itself (its own source validates).
      validation_conflict:
        description: Validating tags disagree with each other.
